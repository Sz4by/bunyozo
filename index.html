<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szaby Canvas Player</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: Arial, sans-serif; background-color: #121212;
            color: #ffffff; display: flex; align-items: center;
            justify-content: center; flex-direction: column;
            user-select: none; overflow: hidden;
            cursor: none; /* Egér eltüntetése */
        }

        /* --- MENÜ --- */
        #player-container {
            width: 90%; max-width: 800px; padding: 20px;
            background-color: #1e1e1e; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); box-sizing: border-box; 
            z-index: 50; position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif; text-align: center;
            font-size: 2.5em; background: linear-gradient(90deg, #4a90e2, #9013fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }
        #url_section { display: flex; gap: 10px; }
        #url {
            flex-grow: 1; padding: 10px; font-size: 1.2em;
            border: 1px solid #444; border-radius: 5px;
            background-color: #2a2a2a; color: #f0f0f0;
        }
        #btn_play {
            padding: 10px 20px; font-size: 1.2em; font-weight: bold;
            color: white; background-color: #4a90e2; 
            border: none; border-radius: 5px; cursor: pointer;
        }
        #btn_play:focus, #url:focus { outline: 3px solid #fff; }

        /* --- CANVAS (Ez jeleníti meg a képet) --- */
        #video-canvas {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 100;
            background: black;
        }

        /* --- REJTETT VIDEÓ (Ez fut a háttérben) --- */
        /* Nem display:none, mert akkor megáll a lejátszás. Csak kilökjük a képről. */
        #hidden-video {
            position: absolute;
            top: -9999px; left: -9999px;
            width: 1px; height: 1px;
            visibility: hidden;
            z-index: -1;
        }

        /* Visszajelző ikonok */
        #feedback-icon {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; color: rgba(255, 255, 255, 0.9);
            z-index: 200; display: none; pointer-events: none;
            text-shadow: 2px 2px 10px #000;
        }
        #loading-indicator {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 20px; z-index: 200; display: none;
        }
    </style>
</head>
<body>

<canvas id="video-canvas"></canvas>

<video id="hidden-video" playsinline webkit-playsinline muted></video>

<div id="feedback-icon">▶</div>
<div id="loading-indicator">Betöltés...</div>

<div id="player-container">
    <h1>Szaby TV Lejátszó</h1>
    <form name="frm1" id="frm1" onsubmit="return false;">
        <div id="url_section">
            <input type="text" name="url" id="url" placeholder="Video link..." autocomplete="off"/>
            <button type="button" name="btn_play" id="btn_play">Lejátszás</button>
        </div>
    </form>
    <div style="margin-top: 15px; color: #ccc; text-align: center;">
        <input type="checkbox" id="proxy-toggle" checked>
        <label for="proxy-toggle">Proxy (CORS)</label>
    </div>
</div>

<script>
    var hls = new Hls();
    var video = document.getElementById('hidden-video'); // Rejtett videó
    var canvas = document.getElementById('video-canvas'); // Vászon
    var ctx = canvas.getContext('2d'); // Rajzoló eszköz
    
    var urlInput = document.getElementById('url');
    var playButton = document.getElementById('btn_play');
    var feedbackIcon = document.getElementById('feedback-icon');
    var loadingIndicator = document.getElementById('loading-indicator');
    var proxyToggle = document.getElementById('proxy-toggle');
    var playerContainer = document.getElementById('player-container');
    
    var isPlaying = false;
    var renderLoopId; // A rajzoló ciklus azonosítója

    // --- CANVAS RAJZOLÓ CIKLUS ---
    // Ez a függvény másolja a videó képét a vászonra másodpercenként 60-szor
    function renderFrame() {
        if (!video.paused && !video.ended) {
            // Méretezés beállítása (hogy ne torzuljon)
            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            // Kiszámoljuk az arányokat (hogy középen legyen, fekete sávokkal)
            var hRatio = canvas.width / video.videoWidth;
            var vRatio = canvas.height / video.videoHeight;
            var ratio = Math.min(hRatio, vRatio);
            var centerShift_x = (canvas.width - video.videoWidth * ratio) / 2;
            var centerShift_y = (canvas.height - video.videoHeight * ratio) / 2;
            
            // Törlés
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Rajzolás
            if (video.videoWidth > 0) {
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight,
                              centerShift_x, centerShift_y, video.videoWidth * ratio, video.videoHeight * ratio);
            }
            
            renderLoopId = requestAnimationFrame(renderFrame);
        }
    }

    // --- IRÁNYÍTÁS ---
    function showFeedback(symbol) {
        feedbackIcon.innerText = symbol;
        feedbackIcon.style.display = 'block';
        feedbackIcon.style.opacity = '1';
        if (window.feedbackTimeout) clearTimeout(window.feedbackTimeout);
        window.feedbackTimeout = setTimeout(() => {
            feedbackIcon.style.opacity = '0';
            setTimeout(() => { feedbackIcon.style.display = 'none'; }, 300);
        }, 800);
    }

    function togglePlay() {
        if (video.paused) {
            video.play().then(() => {
                isPlaying = true;
                showFeedback('▶');
                renderFrame(); // Indul a rajzolás
            }).catch(e => console.log(e));
        } else {
            video.pause();
            isPlaying = false;
            showFeedback('⏸');
            cancelAnimationFrame(renderLoopId); // Megáll a rajzolás, kíméli a procit
        }
    }

    function seekVideo(seconds) {
        if (video.duration) {
            video.currentTime += seconds;
            showFeedback(seconds > 0 ? '⏩' : '⏪');
        }
    }

    // --- BILLENTYŰZET ESEMÉNYEK (TV) ---
    // Most már a window-ra tesszük, mert a canvas a fő elem
    window.addEventListener('keydown', function(e) {
        if (!isPlaying && playerContainer.style.display !== 'none') return; // Ha még a menüben vagyunk, ne reagáljon
        
        // Fontos gomboknál tiltjuk a gyári működést
        if ([13, 32, 37, 39, 415, 19, 179].includes(e.keyCode)) {
             e.preventDefault();
        }

        switch(e.keyCode) {
            case 13: // Enter / OK
            case 32: // Space
            case 415: // Play
            case 19: // Pause
            case 179: // Play/Pause
                togglePlay();
                break;
            case 39: // Jobbra
                seekVideo(15);
                break;
            case 37: // Balra
                seekVideo(-15);
                break;
            case 10009: // Back (Tizen)
            case 461:   // Back (WebOS)
            case 8:     // Backspace
            case 27:    // Escape
                exitPlayer();
                break;
        }
    });

    // --- LEJÁTSZÓ INDÍTÁSA ---
    function startPlayer() {
        var originalUrl = urlInput.value;
        if (!originalUrl) return;

        playerContainer.style.display = 'none';
        canvas.style.display = 'block';
        loadingIndicator.style.display = 'block';

        var useProxy = proxyToggle.checked;
        var finalUrl = useProxy ? `/proxy?url=${encodeURIComponent(originalUrl)}` : originalUrl;
        var isHls = originalUrl.includes('.m3u8') || originalUrl.includes('.txt');
        
        if (hls) hls.destroy();

        // Canvas méretezése induláskor
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        if (isHls && Hls.isSupported()) {
            hls = new Hls(); 
            hls.loadSource(finalUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().then(() => {
                     isPlaying = true;
                     loadingIndicator.style.display = 'none';
                     renderFrame(); // RAJZOLÁS INDUL
                });
            });
        } else {
            video.src = finalUrl;
            video.play().then(() => {
                isPlaying = true;
                renderFrame();
            });
            video.onplaying = () => { loadingIndicator.style.display = 'none'; };
        }
    }

    function exitPlayer() {
        video.pause();
        cancelAnimationFrame(renderLoopId);
        isPlaying = false;
        
        canvas.style.display = 'none';
        playerContainer.style.display = 'block';
        
        if(hls) hls.stopLoad();
        urlInput.focus();
    }

    playButton.addEventListener("click", startPlayer);
    
    // WS kapcsolat (marad a régi)
    function connectWebSocket() {
        const wsProtocol = (location.protocol === 'https:' ? 'wss:' : 'ws:');
        const ws = new WebSocket(wsProtocol + '//' + location.host);
        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'PLAY_VIDEO' && data.url) {
                    urlInput.value = data.url; 
                    startPlayer(); 
                }
            } catch (e) {}
        };
        ws.onclose = function() { setTimeout(connectWebSocket, 3000); };
    }
    connectWebSocket();

</script>

</body>
</html>
