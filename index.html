<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szaby Lejátszó</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: Arial, sans-serif; background-color: #121212;
            color: #ffffff; display: flex; align-items: center;
            justify-content: center; flex-direction: column;
        }
        
        /* Ha a videó aktív, letiltjuk a görgetést a háttérben */
        body.video-active {
            overflow: hidden;
        }

        #player-container {
            width: 90%; max-width: 800px; padding: 20px;
            background-color: #1e1e1e; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); box-sizing: border-box; 
            transition: opacity 0.3s;
        }

        h1 {
            font-family: 'Orbitron', sans-serif; text-align: center;
            font-size: 2.5em; background: linear-gradient(90deg, #4a90e2, #9013fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }
        #url_section { display: flex; gap: 10px; }
        #url {
            flex-grow: 1; padding: 10px; font-size: 1em;
            border: 1px solid #444; border-radius: 5px;
            background-color: #2a2a2a; color: #f0f0f0;
        }
        #btn_play {
            padding: 10px 20px; font-size: 1em; font-weight: bold;
            color: white; background-color: #4a90e2; 
            border: none; border-radius: 5px; cursor: pointer;
            transition: background-color 0.3s;
        }
        #btn_play:hover { background-color: #357abd; }
        #proxy-switch-container {
            margin-top: 15px; display: flex; align-items: center;
            justify-content: center; gap: 8px; color: #ccc;
        }
        #proxy-toggle { cursor: pointer; }
        
        /* --- VIDEÓ STÍLUSOK --- */
        #videoPlayer {
            width: 100%; background-color: black; margin-top: 20px;
            border-radius: 5px; display: none; /* Alapból rejtve */
        }

        /* Ez az osztály aktiválódik lejátszáskor */
        #videoPlayer.full-window {
            display: block !important;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999; /* Minden más fölött legyen */
            margin: 0;
            border-radius: 0;
            object-fit: contain; /* Megtartja az arányokat fekete sávokkal */
        }

        /* Kilépés gomb (X) stílusa */
        #close-btn {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000; /* A videó fölött legyen */
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        #close-btn:hover {
            background: rgba(255, 0, 0, 0.8);
            border-color: red;
        }

        video:focus, video:active { outline: none; border: none; }
        #status-light {
            width: 12px; height: 12px; border-radius: 50%;
            background-color: #f00; 
            margin-left: auto; 
            transition: background-color 0.5s;
        }
    </style>
</head>
<body>

<button id="close-btn" title="Bezárás (ESC)">✕</button>

<div id="player-container">
    <div style="display: flex; align-items: center; width: 100%;">
        <h1>Szaby Lejátszó</h1>
        <div id="status-light" title="Kapcsolat állapota"></div>
    </div>
    
    <form name="frm1" id="frm1" onsubmit="return false;">
        <div id="url_section" name="url_section">
            <input type="text" name="url" id="url" placeholder="Illeszd be a linket..."/>
            <button type="button" name="btn_play" id="btn_play">Play</button>
        </div>
    </form>
    
    <div id="proxy-switch-container">
        <input type="checkbox" id="proxy-toggle" checked>
        <label for="proxy-toggle">Proxy használata (CORS hibák kikerülésére)</label>
    </div>
    
    <video id="videoPlayer" controls autoplay muted></video>
</div>

<script>
    var hls = new Hls();
    var video = document.getElementById('videoPlayer');
    var urlInput = document.getElementById('url');
    var playButton = document.getElementById('btn_play');
    var closeButton = document.getElementById('close-btn');
    var statusLight = document.getElementById('status-light');
    var proxyToggle = document.getElementById('proxy-toggle');

    // --- NÉZET VÁLTÁS (TELJES ABLAK) ---
    function enterFullWindowMode() {
        video.classList.add('full-window');
        document.body.classList.add('video-active');
        closeButton.style.display = 'flex';
        video.style.display = 'block';
    }

    function exitFullWindowMode() {
        video.pause(); // Megállítjuk a videót kilépéskor
        video.classList.remove('full-window');
        document.body.classList.remove('video-active');
        closeButton.style.display = 'none';
        video.style.display = 'none'; // Visszarejtjük, hogy ne tolja szét a formot
        
        // Opcionális: Ha HLS volt, leállítjuk a töltést
        if(hls) {
            hls.stopLoad();
        }
    }

    // Kilépés gomb eseménye
    closeButton.addEventListener('click', exitFullWindowMode);

    // ESC gomb eseménye
    document.addEventListener('keydown', function(e) {
        if (e.key === "Escape" && video.classList.contains('full-window')) {
            exitFullWindowMode();
        }
    });

    // --- LEJÁTSZÓ FUNKCIÓ ---
    function playVideo() {
        var originalUrl = urlInput.value;
        if (!originalUrl) {
            alert("Kérlek, adj meg egy URL-t!");
            return;
        }
        
        // 1. Aktiváljuk a teljes ablakos módot
        enterFullWindowMode();

        var useProxy = proxyToggle.checked;
        var finalUrl = useProxy ? `/proxy?url=${encodeURIComponent(originalUrl)}` : originalUrl;

        console.log(`Lejátszás indítása (${useProxy ? 'Proxyval' : 'Közvetlenül'}): ${finalUrl}`);

        var isHls = originalUrl.includes('.m3u8') || originalUrl.includes('.txt');
        
        if (hls) {
            hls.destroy();
        }

        if (isHls && Hls.isSupported()) {
            hls = new Hls(); 
            hls.loadSource(finalUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log("Autoplay blokkolva, interakció szükséges."));
            });
            
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    console.error('Végzetes HLS hiba:', data);
                }
            });
        } else {
            video.src = finalUrl;
            video.play().catch(e => console.log("Autoplay blokkolva, interakció szükséges."));
        }
    }

    playButton.addEventListener("click", playVideo);
    
    // --- WEBSOCKET CSATLAKOZÁS ---
    function connectWebSocket() {
        const wsProtocol = (location.protocol === 'https:' ? 'wss:' : 'ws:');
        const wsUrl = wsProtocol + '//' + location.host; 
        const ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            console.log('WebSocket csatlakozva a szerverhez.');
            statusLight.style.backgroundColor = '#0f0'; 
            statusLight.title = 'Csatlakozva a mindenttudóhoz';
        };

        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                console.log('Üzenet érkezett a szerverről:', data);

                if (data.type === 'PLAY_VIDEO' && data.url) {
                    urlInput.value = data.url; 
                    // Ha érkezik parancs, állítsuk be a proxy-t is, ha küldték, vagy alapértelmezetten true
                    if (data.useProxy !== undefined) {
                        proxyToggle.checked = data.useProxy;
                    }
                    playVideo(); 
                }
            } catch (e) {
                console.error('WebSocket üzenet hiba:', e);
            }
        };

        ws.onclose = function() {
            console.log('WebSocket kapcsolat bontva. Újracsatlakozás 3 másodperc múlva...');
            statusLight.style.backgroundColor = '#f00'; 
            statusLight.title = 'Kapcsolat bontva';
            setTimeout(connectWebSocket, 3000);
        };

        ws.onerror = function(err) {
            console.error('WebSocket hiba:', err);
            ws.close();
        };
    }
    
    connectWebSocket();
</script>

</body>
</html>
