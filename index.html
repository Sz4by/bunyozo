<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szaby Lejátszó</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #121212; /* Sötét háttér */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column; /* Tartalom középre igazítása */
        }
        
        #player-container {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            box-sizing: border-box; 
        }

        h1 {
            font-family: 'Orbitron', sans-serif; /* A menő betűtípus */
            text-align: center;
            font-size: 2.5em;
            background: linear-gradient(90deg, #4a90e2, #9013fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        #url_section {
            display: flex;
            gap: 10px; 
        }

        #url {
            flex-grow: 1; 
            padding: 10px;
            font-size: 1em;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #f0f0f0;
        }

        #btn_play {
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            background-color: #4a90e2; 
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #btn_play:hover {
            background-color: #357abd; 
        }

        #proxy-switch-container {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ccc;
        }
        #proxy-toggle {
            cursor: pointer;
        }
        
        #videoPlayer {
            width: 100%;
            background-color: black;
            margin-top: 20px;
            border-radius: 5px;
            display: none; /* Alapból rejtett */
        }

        /* --- EZ AZ ÚJ SOR: A JAVÍTÁS --- */
        /* Eltünteti a fehér körvonalat, amikor rákattintasz a videóra */
        video:focus, video:active, #videoPlayer:focus, #videoPlayer:active {
            outline: none;
            border: none;
        }
        /* ------------------------------ */

    </style>
</head>
<body>

<div id="player-container">
    <h1>Szaby Lejátszó</h1>
    
    <form name="frm1" id="frm1" onsubmit="return false;">
        <div id="url_section" name="url_section">
            <input type="text" name="url" id="url" placeholder="Illeszd be a linket..."/>
            <button type="button" name="btn_play" id="btn_play">Play</button>
        </div>
    </form>
    
    <div id="proxy-switch-container">
        <input type="checkbox" id="proxy-toggle" checked>
        <label for="proxy-toggle">Proxy használata (CORS hibák kikerülésére)</label>
    </div>
    
    <video id="videoPlayer" controls autoplay muted></video>
</div>

<script>
    var hls = new Hls(); // Létrehozzuk a HLS lejátszót

    document.getElementById("btn_play").addEventListener("click", function() {
        var video = document.getElementById('videoPlayer');
        var originalUrl = document.getElementById("url").value;

        if (!originalUrl) {
            alert("Kérlek, adj meg egy URL-t!");
            return;
        }
        
        // 1. Ellenőrizzük a kapcsolót
        var useProxy = document.getElementById('proxy-toggle').checked;
        var finalUrl;

        if (useProxy) {
            console.log("Proxy használata: BE");
            finalUrl = `/proxy?url=${encodeURIComponent(originalUrl)}`;
        } else {
            console.log("Proxy használata: KI (Közvetlen lejátszás)");
            finalUrl = originalUrl;
        }

        console.log("Lejátszás indítása: " + finalUrl);
        video.style.display = 'block'; // Mutassuk a videó lejátszót

        // Megnézzük, hogy HLS stream-e (az eredeti link alapján)
        var isHls = originalUrl.includes('.m3u8') || originalUrl.includes('.txt');
        
        if (isHls && Hls.isSupported()) {
            hls.loadSource(finalUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play();
            });
        } else if (isHls && video.canPlayType('application/vnd.apple.mpegurl')) {
            hls.detachMedia();
            video.src = finalUrl;
            video.addEventListener('loadedmetadata', function () {
                video.play();
            });
        } else {
            // Nem HLS (pl. Videa link, vagy .mp4)
            hls.detachMedia(); 
            video.src = finalUrl;
            video.play();
        }
    });
</script>

</body>
</html>
