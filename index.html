<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szaby Lejátszó</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #121212; /* Sötét háttér */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column; /* Tartalom középre igazítása */
        }
        
        #player-container {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            box-sizing: border-box; /* Ez biztosítja, hogy a padding ne növelje meg a doboz méretét */
        }

        h1 {
            font-family: 'Orbitron', sans-serif; /* A menő betűtípus */
            text-align: center;
            font-size: 2.5em;
            /* Színátmenet a címnek */
            background: linear-gradient(90deg, #4a90e2, #9013fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        #url_section {
            display: flex;
            gap: 10px; /* Térköz a beviteli mező és a gomb között */
        }

        #url {
            flex-grow: 1; /* A beviteli mező töltse ki a helyet */
            padding: 10px;
            font-size: 1em;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #f0f0f0;
        }

        #btn_play {
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            background-color: #4a90e2; /* Kék gomb */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #btn_play:hover {
            background-color: #357abd; /* Sötétebb kék hoverre */
        }
        
        #videoPlayer {
            width: 100%;
            background-color: black;
            margin-top: 20px;
            border-radius: 5px;
            display: none; /* Alapból rejtett */
        }
    </style>
</head>
<body>

<div id="player-container">
    <h1>Szaby Lejátszó</h1>
    
    <form name="frm1" id="frm1" onsubmit="return false;">
        <div id="url_section" name="url_section">
            <input type="text" name="url" id="url" placeholder="Illeszd be az .m3u8 vagy .txt linket..."/>
            <button type="button" name="btn_play" id="btn_play">Play</button>
        </div>
    </form>
    
    <video id="videoPlayer" controls autoplay muted></video>
</div>

<script>
    var hls = new Hls(); // Létrehozzuk a HLS lejátszót

    document.getElementById("btn_play").addEventListener("click", function() {
        var video = document.getElementById('videoPlayer');
        var originalUrl = document.getElementById("url").value;

        if (!originalUrl) {
            alert("Kérlek, adj meg egy URL-t!");
            return;
        }
        
        console.log("Lejátszás indítása: " + originalUrl);

        // A videó URL-je most a *saját szerverünk* /proxy végpontjára mutat
        var proxyUrl = `/proxy?url=${encodeURIComponent(originalUrl)}`;
        
        video.style.display = 'block'; // Mutassuk a videó lejátszót

        if (Hls.isSupported()) {
            hls.loadSource(proxyUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = proxyUrl;
            video.addEventListener('loadedmetadata', function () {
                video.play();
            });
        }
    });
</script>

</body>
</html>
