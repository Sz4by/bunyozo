<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szaby Lejátszó</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; background: #121212; color: white; font-family: Arial; 
            display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column;
            overflow: hidden; 
        }
        /* Mozi mód: Eltüntet mindent, csak a videó marad */
        body.cinema-mode #controls, body.cinema-mode h1 { display: none !important; }
        body.cinema-mode #player-container { width: 100%; height: 100%; max-width: none; padding: 0; background: black; }
        body.cinema-mode video { height: 100vh; }

        #player-container { 
            width: 90%; max-width: 800px; padding: 20px; background: #1e1e1e; 
            border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { 
            font-family: 'Orbitron'; text-align: center; margin: 0 0 20px 0;
            background: linear-gradient(90deg, #4a90e2, #9013fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        input { padding: 10px; width: 60%; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 5px; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        #btn_play { background: #4a90e2; }
        #btn_window { background: #28a745; }
        video { width: 100%; display: none; background: black; margin-top: 15px; border-radius: 5px; }
        #controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
        .switch { display: flex; align-items: center; gap: 5px; font-size: 0.9em; color: #ccc; justify-content: center; }
    </style>
</head>
<body>

<div id="player-container">
    <h1>Szaby Lejátszó</h1>
    
    <div id="controls">
        <input type="text" id="url" placeholder="Videó link...">
        <button id="btn_play">Play</button>
        <button id="btn_window">❐ Új ablak</button>
    </div>
    
    <div id="controls" class="switch">
        <input type="checkbox" id="proxy-toggle" checked>
        <label for="proxy-toggle">Proxy (CloudDataCDN-hez kötelező)</label>
    </div>

    <video id="videoPlayer" controls autoplay></video>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    const urlInput = document.getElementById('url');
    const proxyToggle = document.getElementById('proxy-toggle');
    let hls;

    // 1. OLDAL BETÖLTÉSE (Paraméterek figyelése)
    window.onload = () => {
        const params = new URLSearchParams(location.search);
        if (params.has('url')) {
            urlInput.value = params.get('url');
            // Ha 'proxy' paraméter 'true', bepipáljuk. Ha 'false', kivesszük.
            proxyToggle.checked = (params.get('proxy') === 'true');
            
            if (params.get('cinema') === 'true') {
                document.body.classList.add('cinema-mode');
            }
            playVideo();
        }
        connectWs();
    };

    // 2. LEJÁTSZÁS LOGIKA (Ez dönti el: Direkt vagy Proxy)
    function playVideo() {
        const originalUrl = urlInput.value.trim();
        if (!originalUrl) return alert('Nincs URL!');

        const useProxy = proxyToggle.checked;
        
        // ITT A LÉNYEG:
        // Ha useProxy = false -> finalUrl = originalUrl (DIREKT KAPCSOLAT)
        // Ha useProxy = true  -> finalUrl = /proxy... (SZERVEREN ÁT)
        const finalUrl = useProxy ? `/proxy?url=${encodeURIComponent(originalUrl)}` : originalUrl;

        console.log(`Indítás: ${useProxy ? 'PROXY' : 'DIREKT'} -> ${finalUrl}`);
        video.style.display = 'block';

        if (hls) hls.destroy();

        // HLS felismerése (CloudDataCDN és m3u8)
        const isHls = originalUrl.includes('.m3u8') || 
                      originalUrl.includes('cloudatacdn') || 
                      (useProxy && !originalUrl.includes('.mp4'));

        if (isHls && Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(finalUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            hls.on(Hls.Events.ERROR, (e, data) => {
                if (data.fatal) {
                    console.warn('HLS hiba, próba natívan...');
                    hls.destroy();
                    video.src = finalUrl;
                    video.play();
                }
            });
        } else {
            video.src = finalUrl;
            video.play();
        }
    }

    document.getElementById('btn_play').onclick = playVideo;

    // 3. ÚJ ABLAK GOMB
    document.getElementById('btn_window').onclick = () => {
        const url = urlInput.value.trim();
        if (!url) return alert('Nincs URL!');
        // Átadjuk a jelenlegi Proxy beállítást az új ablaknak
        const target = `/?url=${encodeURIComponent(url)}&proxy=${proxyToggle.checked}&cinema=true`;
        window.open(target, '_blank', 'width=900,height=600');
    };

    // 4. WEBSOCKET (Opcionális)
    function connectWs() {
        const ws = new WebSocket((location.protocol=='https:'?'wss:':'ws:')+'//'+location.host);
        ws.onmessage = (e) => {
            try {
                const d = JSON.parse(e.data);
                if (d.type === 'PLAY_VIDEO') {
                    urlInput.value = d.url;
                    proxyToggle.checked = d.useProxy;
                    document.body.classList.remove('cinema-mode'); // Ha parancs jön, lássuk a vezérlőt
                    playVideo();
                }
            } catch(err){}
        };
        ws.onclose = () => setTimeout(connectWs, 3000);
    }
</script>
</body>
</html>
