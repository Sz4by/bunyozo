<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Szaby TV Fix</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        /* --- ALAP BEÁLLÍTÁSOK --- */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none; /* Kijelölés tiltása */
            -webkit-user-select: none;
        }

        /* --- MENÜ (Ami eltűnik lejátszáskor) --- */
        #menu-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; z-index: 50;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif; color: #4a90e2; margin-bottom: 20px;
        }

        #url-box {
            display: flex; gap: 10px; width: 90%; max-width: 600px;
        }
        
        input {
            flex-grow: 1; padding: 15px; font-size: 18px; border-radius: 5px; border: none;
        }
        
        button {
            padding: 15px 30px; font-size: 18px; background: #4a90e2; color: white;
            border: none; border-radius: 5px; font-weight: bold;
        }

        /* --- A LÁTHATATLAN PAJZS (Ez fogja fel a távirányítót) --- */
        #remote-shield {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; /* A legtetején van */
            background: transparent;
            outline: none; cursor: none;
        }

        /* --- A VIDEÓ (Ami most már ad képet) --- */
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; display: none; background: black;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain; /* Vagy 'cover', ha azt akarod hogy levágja a szélét */
            
            /* KRITIKUS: Ez tiltja le a TV interakcióját a videóval */
            pointer-events: none; 
            touch-action: none;
        }

        /* --- CSS HACK A TV SÁV ELLEN --- */
        /* Ezek a sorok tüntetik el a gyári gombokat */
        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-enclosure { display: none !important; }
        video::-webkit-media-controls-panel { display: none !important; }
        
        /* --- VISZZAJELZŐ IKONOK --- */
        #status-icon {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; color: rgba(255,255,255,0.8);
            z-index: 10000; pointer-events: none; display: none;
            text-shadow: 0 0 10px black;
        }
    </style>
</head>
<body>

    <div id="menu-layer">
        <h1>Szaby TV Player</h1>
        <div id="url-box">
            <input type="text" id="url-input" placeholder="Videó link ide..." autocomplete="off">
            <button id="play-btn">START</button>
        </div>
        <div style="margin-top:20px; color:grey;">
            <input type="checkbox" id="proxy-check" checked> <label for="proxy-check">Proxy</label>
        </div>
    </div>

    <div id="remote-shield" tabindex="0"></div>

    <div id="video-container">
        <video id="main-video" 
               playsinline 
               webkit-playsinline 
               disablePictureInPicture 
               disableremoteplayback 
               muted 
               preload="auto">
        </video>
    </div>

    <div id="status-icon">▶</div>

    <script>
        const video = document.getElementById('main-video');
        const shield = document.getElementById('remote-shield');
        const menu = document.getElementById('menu-layer');
        const videoContainer = document.getElementById('video-container');
        const urlInput = document.getElementById('url-input');
        const playBtn = document.getElementById('play-btn');
        const statusIcon = document.getElementById('status-icon');
        const proxyCheck = document.getElementById('proxy-check');
        
        var hls = null;
        var focusInterval;

        // --- IKON MUTATÁSA ---
        function showIcon(symbol) {
            statusIcon.innerText = symbol;
            statusIcon.style.display = 'block';
            clearTimeout(window.iconTimer);
            window.iconTimer = setTimeout(() => {
                statusIcon.style.display = 'none';
            }, 800);
        }

        // --- START (Lejátszás indítása) ---
        playBtn.addEventListener('click', () => {
            let url = urlInput.value;
            if(!url) return;

            if(proxyCheck.checked) {
                url = `/proxy?url=${encodeURIComponent(url)}`;
            }

            // UI váltás
            menu.style.display = 'none';
            videoContainer.style.display = 'block';
            shield.style.display = 'block';

            // HLS vagy MP4 betöltés
            if(hls) hls.destroy();
            
            if (url.includes('.m3u8') && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Play error", e));
                });
            } else {
                video.src = url;
                video.play().catch(e => console.log("Play error", e));
            }

            // FÓKUSZ ZÁROLÁSA A PAJZSON
            // Ez a legfontosabb: folyamatosan elvesszük a fókuszt a videóról
            shield.focus();
            clearInterval(focusInterval);
            focusInterval = setInterval(() => {
                if(document.activeElement !== shield) {
                    shield.focus();
                    // Ha a TV mégis ráugrott a videóra, itt visszarántjuk
                    video.blur(); 
                }
            }, 500);
        });

        // --- IRÁNYÍTÁS (A pajzson keresztül) ---
        // Play/Pause
        function togglePlay() {
            if(video.paused) {
                video.play();
                showIcon('▶');
            } else {
                video.pause();
                showIcon('⏸');
            }
        }

        // Tekerés
        function seek(sec) {
            video.currentTime += sec;
            showIcon(sec > 0 ? '⏩' : '⏪');
        }

        // Kilépés
        function exitPlayer() {
            video.pause();
            video.src = "";
            if(hls) hls.stopLoad();
            
            menu.style.display = 'flex';
            videoContainer.style.display = 'none';
            shield.style.display = 'none';
            clearInterval(focusInterval);
        }

        // GOMBOK FIGYELÉSE (Pajzs események)
        shield.addEventListener('keydown', (e) => {
            e.preventDefault(); // Letiltjuk a gyári működést
            e.stopPropagation();

            const key = e.keyCode;
            
            // OK / Space / Play
            if([13, 32, 415, 19, 179].includes(key)) {
                togglePlay();
            }
            // Jobbra nyíl
            else if(key === 39) {
                seek(15);
            }
            // Balra nyíl
            else if(key === 37) {
                seek(-15);
            }
            // Vissza / Exit / Backspace
            else if([10009, 461, 8, 27].includes(key)) {
                exitPlayer();
            }
        });

        // Kattintás (ha van egér)
        shield.addEventListener('click', () => {
            togglePlay();
            shield.focus();
        });

        // --- WEBSOCKET (Távirányítás telefonról) ---
        // Ez maradhat a régi, hogy telefonról tudd indítani
        try {
            const wsProtocol = (location.protocol === 'https:' ? 'wss:' : 'ws:');
            const ws = new WebSocket(wsProtocol + '//' + location.host);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(data.type === 'PLAY_VIDEO') {
                    urlInput.value = data.url;
                    playBtn.click();
                }
            };
        } catch(e) {}

    </script>
</body>
</html>
