<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szaby TV Stealth Player</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: Arial, sans-serif; background-color: #121212;
            color: #ffffff; display: flex; align-items: center;
            justify-content: center; flex-direction: column;
            user-select: none; overflow: hidden;
            cursor: none; /* Egérkurzor elrejtése */
        }

        /* --- MENÜ STÍLUSOK --- */
        #player-container {
            width: 90%; max-width: 800px; padding: 20px;
            background-color: #1e1e1e; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); box-sizing: border-box; 
            z-index: 50; 
        }

        h1 {
            font-family: 'Orbitron', sans-serif; text-align: center;
            font-size: 2.5em; background: linear-gradient(90deg, #4a90e2, #9013fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }
        #url_section { display: flex; gap: 10px; }
        #url {
            flex-grow: 1; padding: 10px; font-size: 1.2em;
            border: 1px solid #444; border-radius: 5px;
            background-color: #2a2a2a; color: #f0f0f0;
        }
        #btn_play {
            padding: 10px 20px; font-size: 1.2em; font-weight: bold;
            color: white; background-color: #4a90e2; 
            border: none; border-radius: 5px; cursor: pointer;
        }
        #btn_play:focus, #url:focus { outline: 3px solid #fff; }

        /* --- LÁTHATATLAN PAJZS (INPUT SHIELD) --- */
        /* Ez fogja fel a távirányító gombjait a videó helyett */
        #input-shield {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99999; /* Legfelső réteg */
            background: transparent; 
            outline: none;
        }

        /* --- VIDEÓ REJTÉSE A TV ELŐL --- */
        #video-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: black; display: none;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            pointer-events: none; /* A videó NEM kattintható */
        }

        /* HARDCORE CSS: A böngésző belső vezérlőinek letiltása */
        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-enclosure { display: none !important; }
        video::-webkit-media-controls-panel { display: none !important; }
        video::-webkit-media-controls-play-button { display: none !important; }
        video::-webkit-media-controls-start-playback-button { display: none !important; }

        /* Visszajelző ikonok */
        #feedback-icon {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; color: rgba(255, 255, 255, 0.9);
            z-index: 100000; display: none; pointer-events: none;
            text-shadow: 2px 2px 10px #000;
        }
        #loading-indicator {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 20px; z-index: 100000; display: none;
        }
    </style>
</head>
<body>

<div id="input-shield" tabindex="0"></div>

<div id="feedback-icon">▶</div>
<div id="loading-indicator">Betöltés...</div>

<div id="player-container">
    <h1>Szaby TV Lejátszó</h1>
    <form name="frm1" id="frm1" onsubmit="return false;">
        <div id="url_section">
            <input type="text" name="url" id="url" placeholder="Video link..." autocomplete="off"/>
            <button type="button" name="btn_play" id="btn_play">Lejátszás</button>
        </div>
    </form>
    <div style="margin-top: 15px; color: #ccc; text-align: center;">
        <input type="checkbox" id="proxy-toggle" checked>
        <label for="proxy-toggle">Proxy (CORS)</label>
    </div>
</div>

<div id="video-wrapper">
    <video id="videoPlayer" tabindex="-1" playsinline webkit-playsinline muted></video>
</div>

<script>
    var hls = new Hls();
    var video = document.getElementById('videoPlayer');
    var videoWrapper = document.getElementById('video-wrapper');
    var inputShield = document.getElementById('input-shield');
    var urlInput = document.getElementById('url');
    var playButton = document.getElementById('btn_play');
    var feedbackIcon = document.getElementById('feedback-icon');
    var loadingIndicator = document.getElementById('loading-indicator');
    var proxyToggle = document.getElementById('proxy-toggle');
    var playerContainer = document.getElementById('player-container');
    var focusWatchdog;

    // --- VISUAL FEEDBACK ---
    function showFeedback(symbol) {
        feedbackIcon.innerText = symbol;
        feedbackIcon.style.display = 'block';
        feedbackIcon.style.opacity = '1';
        if (window.feedbackTimeout) clearTimeout(window.feedbackTimeout);
        window.feedbackTimeout = setTimeout(() => {
            feedbackIcon.style.opacity = '0';
            setTimeout(() => { feedbackIcon.style.display = 'none'; }, 300);
        }, 800);
    }

    // --- IRÁNYÍTÁS ---
    function togglePlay() {
        if (video.paused) {
            video.play().then(() => showFeedback('▶')).catch(e => {});
        } else {
            video.pause();
            showFeedback('⏸');
        }
    }

    function seekVideo(seconds) {
        if (video.duration) {
            video.currentTime += seconds;
            showFeedback(seconds > 0 ? '⏩' : '⏪');
        }
    }

    // --- TV TÁVIRÁNYÍTÓ KEZELÉS (SHIELD) ---
    inputShield.addEventListener('keydown', function(e) {
        e.preventDefault(); 
        e.stopPropagation();

        // Debug: Kiírhatod a konzolra a gomb kódját
        // console.log("Key:", e.keyCode);

        switch(e.keyCode) {
            case 13: // Enter / OK
            case 32: // Space
            case 415: // Play
            case 19: // Pause
            case 179: // Play/Pause
                togglePlay();
                break;
            case 39: // Jobbra
                seekVideo(15);
                break;
            case 37: // Balra
                seekVideo(-15);
                break;
            case 10009: // Back (Tizen)
            case 461:   // Back (WebOS)
            case 8:     // Backspace
            case 27:    // Escape
                exitFullWindowMode();
                break;
        }
    });
    
    // Egér kattintás kezelés
    inputShield.addEventListener('click', () => {
        togglePlay();
        inputShield.focus();
    });

    // --- TELJES KÉPERNYŐ ÉS FÓKUSZ ŐR ---
    function enterFullWindowMode() {
        playerContainer.style.display = 'none';
        videoWrapper.style.display = 'block';
        inputShield.style.display = 'block';
        
        // FÓKUSZ KÉNYSZERÍTÉSE A PAJZSRA
        inputShield.focus();

        // INDÍTJUK AZ ŐRT: 
        // Fél másodpercenként ellenőrzi, hogy a fókusz nem ugrott-e át véletlenül a videóra.
        // Ha igen, visszarántja a pajzsra.
        if (focusWatchdog) clearInterval(focusWatchdog);
        focusWatchdog = setInterval(() => {
            if (document.activeElement === video) {
                console.log("A TV megpróbálta elvenni a fókuszt! Visszavétel...");
                inputShield.focus();
            }
        }, 500);
    }

    function exitFullWindowMode() {
        video.pause();
        if (focusWatchdog) clearInterval(focusWatchdog); // Őr leállítása
        
        videoWrapper.style.display = 'none';
        inputShield.style.display = 'none';
        playerContainer.style.display = 'block';
        
        if(hls) hls.stopLoad();
        urlInput.focus();
    }

    // --- LEJÁTSZÁS ---
    function playVideo() {
        var originalUrl = urlInput.value;
        if (!originalUrl) return;

        enterFullWindowMode();
        loadingIndicator.style.display = 'block';
        
        var useProxy = proxyToggle.checked;
        var finalUrl = useProxy ? `/proxy?url=${encodeURIComponent(originalUrl)}` : originalUrl;
        var isHls = originalUrl.includes('.m3u8') || originalUrl.includes('.txt');
        
        if (hls) hls.destroy();

        if (isHls && Hls.isSupported()) {
            hls = new Hls(); 
            hls.loadSource(finalUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => {});
                loadingIndicator.style.display = 'none';
            });
        } else {
            video.src = finalUrl;
            video.play().catch(e => {});
            video.onplaying = () => { loadingIndicator.style.display = 'none'; };
        }
    }

    playButton.addEventListener("click", playVideo);
    
    // --- WEBSOCKET ---
    function connectWebSocket() {
        const wsProtocol = (location.protocol === 'https:' ? 'wss:' : 'ws:');
        const wsUrl = wsProtocol + '//' + location.host; 
        const ws = new WebSocket(wsUrl);
        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'PLAY_VIDEO' && data.url) {
                    urlInput.value = data.url; 
                    playVideo(); 
                }
            } catch (e) {}
        };
        ws.onclose = function() { setTimeout(connectWebSocket, 3000); };
    }
    connectWebSocket();
</script>

</body>
</html>
